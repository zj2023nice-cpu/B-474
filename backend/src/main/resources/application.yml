spring:
  application:
    name: lab-equipment-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/lab_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:3434}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:lab-equipment-management-system-secret-key-2024-secure}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
